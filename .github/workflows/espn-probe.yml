# Temporary: GitHub Actions can reach ESPN's public API and the dev sandbox cannot, so this
# runs tmp-espn/probe.mjs on the feature branch and commits its output back for inspection.
# Remove together with tmp-espn/ once the ESPN fetcher is built.
name: ESPN probe
on:
  push:
    branches: [claude/confident-babbage-j34g83]
    paths: ["tmp-espn/*.mjs", ".github/workflows/espn-probe.yml"]

permissions:
  contents: write

concurrency:
  group: espn-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { ref: claude/confident-babbage-j34g83 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tmp-espn/probe2.mjs || echo "::warning::probe exited non-zero"
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Commit output
        if: always()
        run: |
          git add tmp-espn/out tmp-espn/out2
          git diff --cached --quiet && exit 0
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git commit -m "ESPN probe output"
          git pull --rebase origin claude/confident-babbage-j34g83
          git push origin HEAD:claude/confident-babbage-j34g83
